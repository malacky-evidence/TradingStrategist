<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TradingStrategist">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>TradingStrategist — Offline Trading Simulator</title>
<meta name="description" content="Free offline trading simulator: practise forex, crypto, stocks and synthetics with a MetaTrader-style chart, RSI, volume, ICT/smart-money tools and simulated news events. No account, no data feed.">
<meta name="theme-color" content="#0b0f14">
<meta property="og:title" content="TradingStrategist — Offline Trading Simulator">
<meta property="og:description" content="Practise price action, FVG, liquidity and news trading on a realistic simulated market. Free, offline, single file.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Cpath d='M14 46 28 30l8 8 14-18' fill='none' stroke='%234c8dff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0f14;--panel:#10161d;--panel2:#141b24;--line:#1f2935;--text:#d6deea;--mute:#7f8ca0;
  --up:#26a69a;--down:#ef5350;--acc:#4c8dff;--warn:#f5a623;--hi:#ff5a5f;--field:#0b1016;--hover:#192332;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
[data-theme=light]{
  --bg:#eef1f5;--panel:#ffffff;--panel2:#f6f8fa;--line:#dbe1e9;--text:#1b2430;--mute:#66758a;
  --up:#14917f;--down:#d9363e;--acc:#2563eb;--warn:#d98a00;--hi:#d9363e;--field:#ffffff;--hover:#eaf0f8;
  --shadow:0 8px 28px rgba(20,30,50,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{overscroll-behavior:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh}
.spacer{flex:1}
.up{color:var(--up)}.dn{color:var(--down)}.mute{color:var(--mute)}

/* header */
#top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:6px;margin-right:6px}
.brand .logo{color:var(--acc);font-size:16px}.brand small{color:var(--mute)}
.grp{display:flex;gap:4px;align-items:center}
.seg{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{background:none;border:0;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--mute)}
.seg button:hover{background:var(--hover);color:var(--text)}
.seg button.on{background:var(--acc);color:#fff}
select,input{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
select:focus,input:focus{outline:1px solid var(--acc);border-color:var(--acc)}
.tb{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;color:var(--text);white-space:nowrap}
.tb:hover{background:var(--hover)}.tb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tb.accent{background:var(--acc);border-color:var(--acc);color:#fff}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
#simClock{font-weight:600}.clock small{color:var(--mute)}

/* layout */
#body{flex:1;display:grid;grid-template-columns:196px minmax(0,1fr) 312px;min-height:0}
#watch,#side{background:var(--panel);overflow:auto;min-height:0}
#watch{border-right:1px solid var(--line)}#side{border-left:1px solid var(--line)}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#chartRow{flex:1;display:flex;min-height:180px}
#drawBar{width:38px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px 4px}
#drawBar .tb{padding:6px 0;text-align:center;font-size:12px}
#chartWrap{position:relative;flex:1;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#navBar{position:absolute;top:6px;right:80px;display:flex;gap:4px;opacity:.85}
#navBar .tb{padding:3px 8px;background:var(--panel);}
#navBar .tb.accent{background:var(--acc)}
#navBar #nLive{display:none}
#banners{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(560px,92%);pointer-events:none}
.banner{pointer-events:auto;cursor:pointer;opacity:.97;font-size:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:9px;padding:10px 12px;box-shadow:var(--shadow)}
.banner.hi{border-left-color:var(--hi)}.banner.done{border-left-color:var(--acc)}
.banner .bt{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.banner .cd{font-variant-numeric:tabular-nums;color:var(--warn)}
.banner.hi .cd{color:var(--hi)}
.banner .bm{margin-top:4px;color:var(--mute)}.banner .bm b{color:var(--text)}
.banner .pairs{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;background:var(--panel2)}
#resizer{height:6px;cursor:ns-resize;background:var(--line)}
#resizer:hover{background:var(--acc)}
#bottom{height:var(--bh,230px);display:flex;flex-direction:column;background:var(--panel);min-height:90px}
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;border-bottom:1px solid var(--line);padding:0 6px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--mute)}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.cnt{background:var(--panel2);border-radius:9px;padding:0 6px;margin-left:3px;font-size:11px}
#botSummary{color:var(--mute);padding:0 8px;font-size:12px}
#botBody{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--panel2);color:var(--mute);font-weight:500;z-index:1}
th:first-child,td:first-child,td.l,th.l{text-align:left}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--hover)}
.empty{padding:26px;text-align:center;color:var(--mute)}
.mini{padding:2px 8px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;color:var(--text)}
.mini:hover{background:var(--hover)}.mini.red{color:var(--down)}
.tag{display:inline-block;padding:0 7px;border-radius:4px;font-size:11px;font-weight:600}
.tag.buy{background:rgba(38,166,154,.18);color:var(--up)}.tag.sell{background:rgba(239,83,80,.18);color:var(--down)}
.stats{display:flex;gap:18px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--mute);flex-wrap:wrap;align-items:center}
.stats b{color:var(--text)}

/* side cards */
.card{border-bottom:1px solid var(--line)}
.ph{padding:8px 12px;font-weight:600;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ph .sub{color:var(--mute);font-weight:400;font-size:11px}
.pad{padding:10px 12px}
.row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:7px}
.row span{color:var(--mute)}.row input,.row select{width:100%}
.stepper{display:flex}.stepper input{text-align:center;border-radius:0;flex:1}
.stepper button{width:30px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.stepper button:first-child{border-radius:6px 0 0 6px}.stepper button:last-child{border-radius:0 6px 6px 0}
.hint{margin:-4px 0 7px 104px;font-size:11px;color:var(--mute);min-height:14px}
.riskrow{display:flex;gap:8px;align-items:flex-end;margin:4px 0 8px}
.riskrow label{display:flex;flex-direction:column;gap:2px;color:var(--mute);font-size:11px;width:84px}
.summary{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-bottom:9px;font-size:12px;color:var(--mute)}
.summary div{display:flex;justify-content:space-between}.summary b{color:var(--text)}
.trade-btns{display:grid;grid-template-columns:1fr 54px 1fr;gap:4px;align-items:center}
.trade-btns button{border:0;border-radius:8px;padding:9px 6px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center}
.trade-btns small{opacity:.85;letter-spacing:1px}.trade-btns b{font-size:15px}
.trade-btns .sell{background:var(--down)}.trade-btns .buy{background:var(--up)}
.trade-btns button:hover{filter:brightness(1.1)}.trade-btns button:active{transform:translateY(1px)}
.spr{text-align:center;font-size:11px;color:var(--mute)}
.place{width:100%;border:0;border-radius:8px;padding:11px;background:var(--acc);color:#fff;cursor:pointer;font-weight:600}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--mute)}.kv b{color:var(--text);font-weight:600}
.kv.big{font-size:14px}.kv.big b{font-size:16px}
.sep{height:1px;background:var(--line);margin:6px 0}
.xfer{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.xfer input{grid-column:1/3}.xfer #xDep{grid-column:1/3}

.status{border-radius:7px;padding:8px 10px;margin-bottom:9px;font-size:12px;line-height:1.4;border:1px solid var(--line)}
.status.bad{background:rgba(239,83,80,.12);border-color:var(--down)}.status.good{background:rgba(38,166,154,.12);border-color:var(--up)}
.status button{margin-top:6px}
/* watch */
.wrow{display:grid;grid-template-columns:1fr auto;gap:0 6px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.wrow:hover{background:var(--hover)}.wrow.on{background:var(--hover);box-shadow:inset 3px 0 var(--acc)}
.wrow .s{font-weight:600}.wrow .c{font-size:11px;color:var(--mute)}
.wrow .p{text-align:right}.wrow .p small{display:block;font-size:11px}
.wgrp{padding:5px 10px;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.8px;background:var(--panel2)}

/* news */
.nrow{padding:8px 12px;border-bottom:1px solid var(--line)}
.nrow .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.nrow .m{color:var(--mute);font-size:12px;margin-top:2px}
.imp{display:inline-flex;gap:2px;vertical-align:middle;margin-right:5px}
.imp i{width:4px;height:10px;border-radius:1px;background:var(--line)}
.imp.i1 i:nth-child(-n+1){background:#e8c547}.imp.i2 i:nth-child(-n+2){background:var(--warn)}.imp.i3 i{background:var(--hi)}
.pred{margin-top:5px;padding:5px 7px;border-radius:6px;background:var(--panel2);font-size:12px}
.pred.lock{color:var(--mute)}
.nsub{padding:6px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);background:var(--panel2)}

/* overlays */
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(380px,92vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:9px 12px;box-shadow:var(--shadow);animation:in .18s ease-out}
.toast.bad{border-left-color:var(--down)}.toast.good{border-left-color:var(--up)}.toast.warn{border-left-color:var(--warn)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#ctxMenu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:220px}
#ctxMenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:5px;cursor:pointer}
#ctxMenu button:hover{background:var(--hover)}#ctxMenu .h{padding:5px 10px;color:var(--mute);font-size:11px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:14px}
#modal[hidden],#ctxMenu[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(440px,100%);padding:18px;max-height:92vh;overflow:auto}
.mbox h3{margin:0 0 4px}.mbox p{color:var(--mute);margin:0 0 12px}
.mbox .row{grid-template-columns:130px 1fr}
.mbox .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.mbox .btns .tb{padding:8px 14px}
#loading{position:fixed;inset:0;background:var(--bg);z-index:90;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

button:focus-visible,select:focus-visible,input:focus-visible,#cv:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* small screens */
@media (max-width:1100px){#body{grid-template-columns:minmax(0,1fr) 300px}#watch{display:none}}
@media (max-width:820px){
  body{overflow:auto}#app{height:auto;min-height:100vh}
  #body{display:block}#chartRow{height:68vh;min-height:360px;flex:none}#center{display:block}#bottom{height:260px}#side{border-left:0;overflow:visible}
  #botSummary{display:none}
  #top{gap:6px}.brand small{display:none}
  #navBar{top:38px;right:78px}#navBar #nStart,#navBar #nAuto{display:none}
}

</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:system-ui">TradingStrategist needs JavaScript enabled to run.</p></noscript>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo">◢</span><b>TradingStrategist</b><small>Simulator</small></div>
    <div class="grp"><select id="symSel" title="Instrument"></select></div>
    <div class="grp seg" id="tfBar"></div>
    <div class="grp">
      <button class="tb" id="bVol" title="Volume">Vol</button>
      <button class="tb" id="bRsi" title="RSI (14)">RSI</button>
      <button class="tb" id="bFvg" title="Highlight fair value gaps (study aid)">FVG</button>
      <button class="tb" id="bGrid" title="Grid">Grid</button>
    </div>
    <div class="grp seg" id="speedBar"></div>
    <button class="tb accent" id="bInstall" hidden title="Install TradingStrategist as an app on this device">⬇ Install app</button>
    <button class="tb" id="bStep" title="Pause, then reveal the market one candle at a time (N)">⏩ Candle</button>
    <button class="tb" id="bNext" title="Fast-forward to the next news release alert">⏭ Next news</button>
    <div class="spacer"></div>
    <div class="clock"><span id="simClock">—</span><small id="simSession">—</small></div>
    <button class="tb" id="bTheme" title="Light / dark">◐</button>
    <button class="tb" id="bMenu" title="Settings">⚙</button>
  </header>

  <div id="body">
    <aside id="watch">
      <div class="ph">Market Watch</div>
      <div id="watchList"></div>
    </aside>

    <main id="center">
      <div id="chartRow">
        <div id="drawBar">
          <button class="tb" data-tool="" id="tCursor" title="Cursor (Esc)">🖱</button>
          <button class="tb" data-tool="hline" title="Horizontal line">━</button>
          <button class="tb" data-tool="trend" title="Trend line (click two points or drag)">╱</button>
          <button class="tb" data-tool="rect" title="Rectangle / zone">▭</button>
          <button class="tb" data-tool="fib" title="Fibonacci retracement">Fib</button>
          <button class="tb" id="bMagnet" title="Magnet: snap to candle OHLC">🧲</button>
          <button class="tb" id="bClear" title="Delete all drawings on this symbol">🗑</button>
        </div>
        <div id="chartWrap">
          <canvas id="cv"></canvas>
          <div id="navBar">
            <button class="tb" id="nStart" title="Oldest data (Home)">⏮</button>
            <button class="tb" id="nBack" title="Scroll back (←)">◀</button>
            <button class="tb" id="nFwd" title="Scroll forward (→)">▶</button>
            <button class="tb" id="nZout" title="Zoom out (−)">−</button>
            <button class="tb" id="nZin" title="Zoom in (+)">+</button>
            <button class="tb" id="nAuto" title="Reset price scale">Auto</button>
            <button class="tb accent" id="nLive" title="Jump to latest candle (End)">Live ⏭</button>
          </div>
          <div id="banners"></div>
        </div>
      </div>
      <div id="resizer" title="Drag to resize"></div>
      <section id="bottom">
        <div class="tabs" id="botTabs">
          <button data-tab="pos" class="on">Trade <span class="cnt" id="cPos">0</span></button>
          <button data-tab="pend">Pending <span class="cnt" id="cPend">0</span></button>
          <button data-tab="hist">History</button>
          <button data-tab="wallet">Wallet log</button>
          <button data-tab="log">Journal</button>
          <div class="spacer"></div>
          <div id="botSummary"></div>
        </div>
        <div id="botBody"></div>
      </section>
    </main>

    <aside id="side">
      <section class="card" id="ticket">
        <div class="ph">New order <span id="tkSym"></span></div>
        <div class="pad">
          <label class="row"><span>Type</span>
            <select id="oType">
              <option value="market">Market execution</option>
              <option value="buy_limit">Buy limit</option><option value="sell_limit">Sell limit</option>
              <option value="buy_stop">Buy stop</option><option value="sell_stop">Sell stop</option>
            </select></label>
          <label class="row" id="rowEntry" hidden><span>Entry price</span><input id="oPrice" type="number" step="any"></label>
          <label class="row"><span>Volume (lots)</span>
            <div class="stepper"><button id="lotMinus" type="button">−</button><input id="oLots" type="number" min="0.01" step="0.01" value="0.10"><button id="lotPlus" type="button">+</button></div></label>
          <label class="row"><span>Stop loss</span><input id="oSL" type="number" step="any" placeholder="none"></label>
          <div class="hint" id="hintSL"></div>
          <label class="row"><span>Take profit</span><input id="oTP" type="number" step="any" placeholder="none"></label>
          <div class="hint" id="hintTP"></div>
          <div class="riskrow">
            <label>Risk %<input id="oRisk" type="number" min="0.1" step="0.1" value="1"></label>
            <button class="tb" id="bRisk" type="button" title="Set lots so that hitting the stop loss costs this % of equity">Lots from risk</button>
          </div>
          <div class="summary" id="tkSummary"></div>
          <div id="tkStatus" class="status" hidden></div>
          <div id="mktBtns" class="trade-btns">
            <button class="sell" id="bSell"><small>SELL</small><b id="pxSell">—</b></button>
            <div class="spr" id="spr">—</div>
            <button class="buy" id="bBuy"><small>BUY</small><b id="pxBuy">—</b></button>
          </div>
          <button class="place" id="bPlace" hidden>Place order</button>
        </div>
      </section>

      <section class="card" id="acct">
        <div class="ph">Accounts</div>
        <div class="pad">
          <div class="kv big"><span>Main account</span><b id="aMain">—</b></div>
          <div class="sep"></div>
          <div class="kv big"><span>Trading account</span><b id="aBal">—</b></div>
          <div class="kv"><span>Equity</span><b id="aEq">—</b></div>
          <div class="kv"><span>Floating P/L</span><b id="aFl">—</b></div>
          <div class="kv"><span>Margin used</span><b id="aMg">—</b></div>
          <div class="kv"><span>Free margin</span><b id="aFree">—</b></div>
          <div class="kv"><span>Margin level</span><b id="aLvl">—</b></div>
          <div class="xfer">
            <input id="xAmt" type="number" min="0" step="any" placeholder="Amount">
            <button class="tb" id="xTo" title="Move money from Main to Trading">Main → Trading</button>
            <button class="tb" id="xFrom" title="Move money from Trading to Main">Trading → Main</button>
            <button class="tb" id="xDep" title="Add new money to the Main account">+ Add to Main</button>
          </div>
        </div>
      </section>

      <section class="card" id="newsCard">
        <div class="ph">Economic news <span class="sub">simulated</span></div>
        <div id="newsList"></div>
      </section>
    </aside>
  </div>
</div>

<div id="toasts"></div>
<div id="ctxMenu" hidden></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="loading"><div><div class="spin"></div><p>Generating 30 days of market history…</p></div></div>

<script>
'use strict';
/* ===================== MARKET ENGINE =====================
 * Deterministic (seeded) price-action simulator.
 * Regimes: range / uptrend / downtrend, impulse+pullback legs,
 * displacement candles (create FVGs), liquidity sweeps at range edges,
 * session volatility, and randomly generated macro news with pre-release
 * predictions and post-release price shocks.
 */
const TFMS = {M1:60000,M5:300000,M15:900000,M30:1800000,H1:3600000,H4:14400000,D1:86400000};
const TF_KEYS = Object.keys(TFMS);
const NEWS_SLOTS={USD:[12.5,12.5,12.5,14,14,15],EUR:[9,10,10,11],GBP:[7,7,9.5],JPY:[0,0.5,3]};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeRng(seed){
  const r=mulberry32(seed>>>0);
  r.gauss=()=>{let u=0;while(u===0)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  r.range=(a,b)=>a+(b-a)*r();
  r.int=(a,b)=>Math.floor(a+(b-a+1)*r());
  return r;
}

function marketClosed(def,h,dow){
  if(def.sess==='fx')return dow===6||(dow===0&&h<22)||(dow===5&&h>=22);
  if(def.sess==='stock')return dow===6||dow===0;
  return false;
}
function sessionMult(def,h,dow){
  if(marketClosed(def,h,dow))return 0.12;     // weekend: thin, near-flat (real FX/stock markets are closed)
  switch(def.sess){
    case 'fx':{let m;
      if(h<7)m=0.6;else if(h<9)m=1.5;else if(h<12)m=1.15;else if(h<16)m=1.55;else if(h<20)m=0.95;else m=0.5;
      if(def.sym==='USDJPY'&&h<7)m=1.0;return m;}
    case 'stock': return (h>=13.5&&h<20)?(h<15?1.8:1.2):0.3;
    case 'crypto': return (h>=13&&h<21)?1.25:0.85;
    default: return 1;
  }
}
function sessionName(h,dow){
  if(dow===6||(dow===0&&h<22)||(dow===5&&h>=22))return 'Weekend — FX & stocks closed';
  if(h>=13&&h<16)return 'London / New York overlap';
  if(h>=7&&h<13)return 'London session';
  if(h>=16&&h<21)return 'New York session';
  if(h>=0&&h<7)return 'Asian session';
  return 'Late / low liquidity';
}

function newRegime(st,sig){
  const r=st.rng,prev=st.regime,pick=r();
  if(prev==='range'){
    if(pick<0.62) st.regime = st.lastSweep ? (st.lastSweep>0?'down':'up') : (r()<0.5?'up':'down');
    else st.regime='range';
  }else{
    if(pick<0.45) st.regime='range';
    else if(pick<0.70) st.regime = prev==='up'?'down':'up';
    else st.regime=prev;
  }
  st.regLeft = st.regime==='range' ? r.int(80,300) : r.int(45,160);
  if(st.regime==='range'){const half=sig*r.range(10,24);st.rHi=st.price+half;st.rLo=st.price-half;}
  st.dir = st.regime==='up'?1:st.regime==='down'?-1:0;
  st.leg='impulse'; st.legLeft=r.int(6,22);
  st.lastSweep=0;
}

class Market{
  constructor(seed,t0,minutes){
    this.seed=seed; this.t0=t0; this.minutes=0; this.minuteT=t0; this.sub=0; this.live=false; this.hour=0;
    this.newsRng=makeRng(seed*7919+13); this.news=[]; this.newsDay=t0-(t0%86400000); this.scanFrom=0; this.nid=0;
    this.handlers={}; this.st={};
    INSTRUMENTS.forEach((d,i)=>{
      const rng=makeRng(seed*31+i*977+1);
      const s={def:d,rng,price:d.p0*(1+rng.range(-0.01,0.01)),regime:'range',regLeft:0,leg:'impulse',legLeft:0,dir:0,rHi:0,rLo:0,
        script:[],candles:{},plan:null,newsVol:1,spreadMult:1,lastSweep:0};
      TF_KEYS.forEach(k=>s.candles[k]=[]);
      this.st[d.sym]=s;
    });
    this.generate(minutes);
  }
  on(ev,fn){(this.handlers[ev]=this.handlers[ev]||[]).push(fn);}
  emit(ev,x){if(!this.live)return;(this.handlers[ev]||[]).forEach(f=>f(x));}

  /* ---------- news ---------- */
  round(x,step){return Math.round(x/step)*step;}
  makeEvent(tpl,t){
    const r=this.newsRng;
    const sd=tpl.sd!==undefined?tpl.sd:tpl.step*2;
    const fc=this.round(tpl.base+r.gauss()*sd,tpl.step);
    const prev=this.round(fc+r.gauss()*tpl.step*1.5,tpl.step);
    const w=tpl.calm?[0.01,0.04,0.12,0.66,0.12,0.04,0.01]:[0.05,0.13,0.2,0.24,0.2,0.13,0.05];
    let x=r(),acc=0,k=0;for(;k<7;k++){acc+=w[k];if(x<acc)break;}
    const steps=Math.min(k,6)-3;
    const conf=Math.round(r.range(52,82));
    let lean=Math.sign(steps);
    if(r()*100>conf) lean=[-1,0,1][r.int(0,2)];
    return {id:0,t,title:tpl.title,ccy:tpl.ccy,impact:tpl.impact,unit:tpl.unit,dec:tpl.dec,dir:tpl.dir,
      forecast:fc,previous:prev,actual:fc+steps*tpl.step,steps,z:steps/1.5,conf,lean,
      mag:tpl.impact===3?5:tpl.impact===2?3.2:2,state:0};
  }
  genDay(day){
    const dow=new Date(day).getUTCDay();if(dow===0||dow===6)return;
    const r=this.newsRng,n=r.int(3,6),used=new Set(),evs=[];let calm=false;
    let tw=0;NEWS_TPL.forEach(x=>tw+=x.w);
    for(let k=0,guard=0;k<n&&guard<40;guard++){
      let pick=r()*tw,tpl=NEWS_TPL[0];
      for(const x of NEWS_TPL){pick-=x.w;if(pick<=0){tpl=x;break;}}
      if(used.has(tpl.title)||(tpl.calm&&calm))continue;
      used.add(tpl.title);if(tpl.calm)calm=true;
      const slots=NEWS_SLOTS[tpl.ccy],hr=slots[r.int(0,slots.length-1)];
      const t=Math.round((day+hr*3600000)/300000)*300000;
      if(t<this.t0+60000)continue;
      evs.push(this.makeEvent(tpl,t));k++;
    }
    evs.sort((a,b)=>a.t-b.t);evs.forEach(x=>{x.id=++this.nid;this.news.push(x);});
  }
  ensureNews(t){
    while(this.newsDay<t+80*3600000){this.genDay(this.newsDay);this.newsDay+=86400000;}
  }
  affects(def,ev){return def.fx[ev.ccy]!==undefined;}
  applyNews(ev){
    for(const sym in this.st){
      const st=this.st[sym],d=st.def;
      if(!this.affects(d,ev))continue;
      const sig=st.price*d.vol,scale=ev.impact===3?16:ev.impact===2?8:3.5;
      let total=ev.z*d.fx[ev.ccy]*ev.dir*scale*sig;
      if(ev.z===0)total=(st.rng()<0.5?1:-1)*scale*sig*0.25;
      const sg=Math.sign(total)||1,a=Math.abs(total);
      const sc=[];
      if(st.rng()<0.35)sc.push({d:-sg*a*0.4,v:3.5});          // fake-out spike against the real direction
      sc.push({d:sg*a*0.55,v:3.5},{d:sg*a*0.30,v:2.5},{d:sg*a*0.15,v:1.8},{d:-sg*a*0.08,v:1.4});
      st.script=sc;
    }
  }
  upcoming(n){return this.news.filter(e=>e.state<3).slice(0,n||6);}
  released(n){const o=this.news.filter(e=>e.state===3);return o.slice(-(n||20)).reverse();}

  /* ---------- minute generation ---------- */
  beginMinute(){
    const t=this.minuteT;this.ensureNews(t);
    const d=new Date(t);this.hour=d.getUTCHours()+d.getUTCMinutes()/60;this.dow=d.getUTCDay();
    for(let i=this.scanFrom;i<this.news.length;i++){
      const ev=this.news[i],dt=ev.t-t;
      if(dt>15*60000)break;
      if(dt<=10*60000&&ev.state<1){ev.state=1;this.emit('pre',ev);}
      if(dt<=2*60000&&ev.state<2){ev.state=2;this.emit('soon',ev);}
      if(dt<=0&&ev.state<3){ev.state=3;this.applyNews(ev);this.emit('release',ev);}
      if(ev.state===3&&t-ev.t>40*60000&&i===this.scanFrom)this.scanFrom++;
    }
    for(const sym in this.st){
      const st=this.st[sym];let nv=1,sp=1;
      for(let i=this.scanFrom;i<this.news.length;i++){
        const ev=this.news[i],dt=t-ev.t;
        if(dt<-10*60000)break;
        if(!this.affects(st.def,ev))continue;
        if(dt<0){nv=Math.min(nv,0.6);sp=Math.max(sp,1.5);}
        else if(dt<3*60000){nv=Math.max(nv,ev.mag);sp=Math.max(sp,5);}
        else if(dt<10*60000){nv=Math.max(nv,ev.mag*0.6);sp=Math.max(sp,2.5);}
        else if(dt<25*60000){nv=Math.max(nv,1.4);sp=Math.max(sp,1.3);}
      }
      st.newsVol=nv;st.spreadMult=sp;
    }
  }
  queueSweep(st,dir,sig){
    const r=st.rng;
    st.script.push({d:dir*sig*r.range(2,5),v:1.6});
    st.script.push({d:-dir*sig*r.range(6,12),v:2.2});   // reversal displacement after the stop hunt
    st.script.push({d:-dir*sig*r.range(1,3),v:1.5});
    st.lastSweep=dir;
  }
  genMinute(st){
    const d=st.def,r=st.rng,sm=sessionMult(d,this.hour,this.dow),sig=st.price*d.vol;
    if(st.regLeft<=0)newRegime(st,sig);
    st.regLeft--;
    let total,nm,scripted=false;
    if(st.script.length){const s=st.script.shift();total=s.d;nm=s.v*sm;scripted=true;}
    else{
      let drift=0;
      if(st.regime==='range'){
        const mid=(st.rHi+st.rLo)/2,half=(st.rHi-st.rLo)/2;
        drift=-(st.price-mid)/half*sig*0.35;
        if(r()<0.012){
          if(st.price>mid+half*0.6)this.queueSweep(st,1,sig);
          else if(st.price<mid-half*0.6)this.queueSweep(st,-1,sig);
        }
      }else{
        if(--st.legLeft<=0){
          st.leg=st.leg==='impulse'?'pullback':'impulse';
          st.legLeft=st.leg==='impulse'?r.int(8,28):r.int(4,14);
        }
        if(st.leg==='impulse'){
          drift=st.dir*sig*0.20;
          if(r()<0.035){
            st.script.push({d:st.dir*sig*r.range(3,5),v:2.2});       // displacement candle
            st.script.push({d:st.dir*sig*r.range(1.5,3),v:1.6});     // continuation leaves an FVG
          }
        }else drift=-st.dir*sig*0.13;
      }
      drift+=-Math.log(st.price/d.p0)/(d.vol*38)*0.105*sig;  // weak pull back to the anchor, scaled by each instrument's own volatility
      total=drift*sm*st.newsVol;
      nm=sm*st.newsVol;
    }
    const sg=sig*nm/Math.sqrt(SUB),path=[],minP=d.p0*0.2;
    let p=st.price;
    for(let i=0;i<SUB;i++){
      p+=total/SUB+r.gauss()*sg;
      if(p<minP)p=minP;
      path.push(p);
    }
    const net=Math.abs(p-st.price);
    const vol=Math.max(1,Math.round(d.tv*nm*(0.6+r()*0.8)*(1+net/(sig*nm+1e-12)*0.5)));
    return {path,vol};
  }
  pushTick(st,prev,p,v){
    const t=this.minuteT;
    for(const k of TF_KEYS){
      const ms=TFMS[k],b=t-t%ms,arr=st.candles[k],last=arr[arr.length-1];
      if(!last||last.t!==b)arr.push({t:b,o:prev,h:Math.max(prev,p),l:Math.min(prev,p),c:p,v:v});
      else{if(p>last.h)last.h=p;if(p<last.l)last.l=p;last.c=p;last.v+=v;}
    }
  }
  generate(n){
    for(let i=0;i<n;i++){
      this.beginMinute();
      for(const sym in this.st){
        const st=this.st[sym],pl=this.genMinute(st);
        let h=st.price,l=st.price;
        for(const p of pl.path){if(p>h)h=p;if(p<l)l=p;}
        st.candles.M1.push({t:this.minuteT,o:st.price,h,l,c:pl.path[SUB-1],v:pl.vol});
        st.price=pl.path[SUB-1];
      }
      this.minuteT+=60000;this.minutes++;
    }
    for(const sym in this.st){
      const st=this.st[sym],m1=st.candles.M1;
      for(const k of TF_KEYS){
        if(k==='M1')continue;
        const ms=TFMS[k],out=[];
        for(const c of m1){
          const b=c.t-c.t%ms,last=out[out.length-1];
          if(!last||last.t!==b)out.push({t:b,o:c.o,h:c.h,l:c.l,c:c.c,v:c.v});
          else{if(c.h>last.h)last.h=c.h;if(c.l<last.l)last.l=c.l;last.c=c.c;last.v+=c.v;}
        }
        st.candles[k]=out;
      }
    }
  }

  /* ---------- live ---------- */
  tick(){
    if(this.sub===0){
      this.beginMinute();
      for(const sym in this.st)this.st[sym].plan=this.genMinute(this.st[sym]);
    }
    for(const sym in this.st){
      const st=this.st[sym],p=st.plan.path[this.sub];
      this.pushTick(st,st.price,p,Math.max(1,Math.round(st.plan.vol/SUB)));
      st.price=p;
    }
    this.sub++;
    if(this.sub>=SUB){this.sub=0;this.minuteT+=60000;this.minutes++;}
  }
  get simTime(){return this.minuteT+this.sub*5000;}
  quote(sym){
    const st=this.st[sym],d=st.def,sp=d.spread*st.spreadMult;
    return {bid:st.price,ask:st.price+sp,spread:sp};
  }
  candles(sym,tf){return this.st[sym].candles[tf];}
  fmt(sym,p){return p.toFixed(INST_BY_SYM[sym].digits);}
}

'use strict';
/* ===================== TRADING + ACCOUNTS =====================
 * Two wallets: Main (normal) account and Trading account. Transfers between them.
 * Trading account: balance, equity, margin, free margin, margin level, stop-out.
 * Orders: market, limit, stop. Positions: SL/TP, modify, partial close, close all.
 */
const LEVERAGE = 100;
const STOP_OUT = 20;       // % margin level
const STORE_KEY = 'TradingStrategist_sim_v1';

class Broker{
  constructor(market){
    this.m=market;
    this.main=10000;           // normal account (cash)
    this.balance=0;            // trading account balance
    this.positions=[];         // open
    this.pending=[];           // pending orders
    this.history=[];           // closed trades
    this.transfers=[];         // wallet log
    this.nextId=1001;
    this.handlers={};
  }
  on(ev,fn){(this.handlers[ev]=this.handlers[ev]||[]).push(fn);}
  emit(ev,x){(this.handlers[ev]||[]).forEach(f=>f(x));}

  /* ---------- math ---------- */
  toUSD(sym,amountInQuote){
    const d=INST_BY_SYM[sym];
    if(d.quote==='JPY')return amountInQuote/this.m.st[sym].price;
    return amountInQuote;
  }
  pnl(pos,price){
    const d=INST_BY_SYM[pos.sym];
    const raw=(pos.type==='buy'?price-pos.open:pos.open-price)*pos.lots*d.contract;
    return this.toUSD(pos.sym,raw);
  }
  marginFor(sym,lots,price){
    const d=INST_BY_SYM[sym];
    return this.toUSD(sym,lots*d.contract*price)/LEVERAGE;
  }
  closePrice(pos){const q=this.m.quote(pos.sym);return pos.type==='buy'?q.bid:q.ask;}
  floating(){let s=0;for(const p of this.positions)s+=this.pnl(p,this.closePrice(p))-p.commission;return s;}
  usedMargin(){let s=0;for(const p of this.positions)s+=p.margin;return s;}
  get equity(){return this.balance+this.floating();}
  get freeMargin(){return this.equity-this.usedMargin();}
  get marginLevel(){const u=this.usedMargin();return u>0?this.equity/u*100:0;}

  /* ---------- wallets ---------- */
  deposit(amount){ // add cash to the normal account
    if(!(amount>0))return 'Enter an amount greater than 0';
    this.main+=amount;this.transfers.unshift({t:this.m.simTime,type:'Deposit to Main',amount});this.save();return null;
  }
  setMain(amount){
    if(!(amount>=0))return 'Invalid amount';
    this.main=amount;this.transfers.unshift({t:this.m.simTime,type:'Main balance set',amount});this.save();return null;
  }
  transfer(dir,amount){ // dir: 'toTrading' | 'toMain'
    if(!(amount>0))return 'Enter an amount greater than 0';
    if(dir==='toTrading'){
      if(amount>this.main+1e-9)return 'Not enough funds in the Main account';
      this.main-=amount;this.balance+=amount;
      this.transfers.unshift({t:this.m.simTime,type:'Main → Trading',amount});
    }else{
      if(amount>this.freeMargin+1e-9)return 'Amount exceeds free margin of the Trading account';
      if(amount>this.balance+1e-9)return 'Amount exceeds Trading balance';
      this.balance-=amount;this.main+=amount;
      this.transfers.unshift({t:this.m.simTime,type:'Trading → Main',amount});
    }
    this.save();this.emit('change');return null;
  }

  /* ---------- orders ---------- */
  validate(sym,type,lots,price,sl,tp){
    const d=INST_BY_SYM[sym];
    if(!(lots>=0.01))return 'Minimum volume is 0.01 lot';
    if(lots>100)return 'Maximum volume is 100 lots';
    const buy=type==='buy'||type==='buy_limit'||type==='buy_stop';
    if(sl&&(buy?sl>=price:sl<=price))return 'Stop loss is on the wrong side of the price';
    if(tp&&(buy?tp<=price:tp>=price))return 'Take profit is on the wrong side of the price';
    const need=this.marginFor(sym,lots,price);
    if(need>this.freeMargin)return 'Not enough free margin (need '+need.toFixed(2)+', have '+this.freeMargin.toFixed(2)+'). Transfer funds to the Trading account.';
    return null;
  }
  marketOrder(sym,type,lots,sl,tp,comment){
    lots=Math.round(lots*100)/100;
    const q=this.m.quote(sym),price=type==='buy'?q.ask:q.bid;
    const err=this.validate(sym,type,lots,price,sl,tp);if(err)return err;
    const d=INST_BY_SYM[sym];
    const pos={id:this.nextId++,sym,type,lots,open:price,sl:sl||0,tp:tp||0,openTime:this.m.simTime,
      margin:this.marginFor(sym,lots,price),commission:lots*(d.cls==='Forex'||d.cls==='Metals'?3.5:d.cls==='Crypto'?2:d.cls==='Stocks'?1:0),comment:comment||''};
    this.positions.push(pos);this.save();this.emit('change');this.emit('open',pos);return null;
  }
  pendingOrder(sym,type,lots,price,sl,tp){
    lots=Math.round(lots*100)/100;
    const q=this.m.quote(sym);
    if(!(price>0))return 'Enter an entry price';
    if(type==='buy_limit'&&price>=q.ask)return 'Buy limit must be below the current ask';
    if(type==='sell_limit'&&price<=q.bid)return 'Sell limit must be above the current bid';
    if(type==='buy_stop'&&price<=q.ask)return 'Buy stop must be above the current ask';
    if(type==='sell_stop'&&price>=q.bid)return 'Sell stop must be below the current bid';
    const err=this.validate(sym,type,lots,price,sl,tp);if(err)return err;
    this.pending.push({id:this.nextId++,sym,type,lots,price,sl:sl||0,tp:tp||0,time:this.m.simTime});
    this.save();this.emit('change');return null;
  }
  cancelPending(id){this.pending=this.pending.filter(o=>o.id!==id);this.save();this.emit('change');}
  modify(id,sl,tp){
    const p=this.positions.find(x=>x.id===id);
    if(p){
      const q=this.m.quote(p.sym),buy=p.type==='buy',ref=buy?q.bid:q.ask;
      if(sl&&(buy?sl>=ref:sl<=ref))return 'Stop loss must be '+(buy?'below the bid':'above the ask');
      if(tp&&(buy?tp<=ref:tp>=ref))return 'Take profit must be '+(buy?'above the bid':'below the ask');
      p.sl=sl||0;p.tp=tp||0;this.save();this.emit('change');return null;
    }
    const o=this.pending.find(x=>x.id===id);
    if(o){o.sl=sl||0;o.tp=tp||0;this.save();this.emit('change');return null;}
    return 'Trade not found';
  }
  movePending(id,price){const o=this.pending.find(x=>x.id===id);if(o){o.price=price;this.save();this.emit('change');}}
  close(id,lots,reason){
    const i=this.positions.findIndex(x=>x.id===id);if(i<0)return 'Position not found';
    const p=this.positions[i];
    return this.closeAt(p,this.closePrice(p),lots,reason||'manual');
  }
  closeAt(p,price,lots,reason){
    const i=this.positions.indexOf(p);if(i<0)return 'Position not found';
    lots=lots&&lots<p.lots-1e-9?lots:p.lots;
    const frac=lots/p.lots,gross=this.pnl({...p,lots},price),comm=p.commission*frac;
    const net=gross-comm;
    this.balance+=net;
    this.history.unshift({id:p.id,sym:p.sym,type:p.type,lots,open:p.open,close:price,sl:p.sl,tp:p.tp,
      openTime:p.openTime,closeTime:this.m.simTime,commission:comm,profit:net,reason});
    if(lots<p.lots-1e-9){p.lots-=lots;p.margin*=1-frac;p.commission-=comm;}
    else this.positions.splice(i,1);
    if(this.history.length>2000)this.history.length=2000;
    this.save();this.emit('change');this.emit('closed',{p,price,net,reason});return null;
  }
  closeAll(filter,reason){
    for(const p of [...this.positions]){
      if(filter==='profit'&&this.pnl(p,this.closePrice(p))<=0)continue;
      if(filter==='loss'&&this.pnl(p,this.closePrice(p))>=0)continue;
      this.close(p.id,0,reason);
    }
  }

  /* ---------- per-tick engine: fills, SL/TP, stop-out ---------- */
  onTick(){
    let changed=false;
    for(const o of [...this.pending]){
      const q=this.m.quote(o.sym);
      const trig=(o.type==='buy_limit'&&q.ask<=o.price)||(o.type==='sell_limit'&&q.bid>=o.price)||
                 (o.type==='buy_stop'&&q.ask>=o.price)||(o.type==='sell_stop'&&q.bid<=o.price);
      if(!trig)continue;
      this.pending=this.pending.filter(x=>x!==o);
      const buy=o.type.startsWith('buy'),d=INST_BY_SYM[o.sym];
      const margin=this.marginFor(o.sym,o.lots,o.price);
      if(margin>this.freeMargin){this.emit('toast',{kind:'bad',msg:'Pending #'+o.id+' cancelled: not enough margin'});changed=true;continue;}
      const isStop=o.type.endsWith('stop'),fill=isStop?(buy?Math.max(o.price,q.ask):Math.min(o.price,q.bid)):(buy?Math.min(o.price,q.ask):Math.max(o.price,q.bid));
      this.positions.push({id:o.id,sym:o.sym,type:buy?'buy':'sell',lots:o.lots,open:fill,sl:o.sl,tp:o.tp,openTime:this.m.simTime,
        margin,commission:o.lots*(d.cls==='Forex'||d.cls==='Metals'?3.5:d.cls==='Crypto'?2:d.cls==='Stocks'?1:0),comment:o.type.replace('_',' ')});
      this.emit('toast',{kind:'info',msg:'Pending order #'+o.id+' triggered ('+o.type.replace('_',' ')+' '+o.sym+')'});
      changed=true;
    }
    for(const p of [...this.positions]){
      const q=this.m.quote(p.sym),buy=p.type==='buy',px=buy?q.bid:q.ask;
      if(p.sl&&(buy?px<=p.sl:px>=p.sl)){this.closeAt(p,px,0,'sl');changed=true;continue;}   // fills at the real price (slippage when price gaps through the stop)
      if(p.tp&&(buy?px>=p.tp:px<=p.tp)){this.closeAt(p,p.tp,0,'tp');changed=true;}
    }
    if(this.positions.length&&this.marginLevel<100&&this.marginLevel>=STOP_OUT){
      if(!this._mcWarned){this._mcWarned=true;this.emit('toast',{kind:'bad',msg:'MARGIN CALL: margin level is below 100%. Reduce risk or transfer funds.'});}
    }else if(this.marginLevel>=150)this._mcWarned=false;
    if(this.positions.length&&this.marginLevel<STOP_OUT){
      this.emit('toast',{kind:'bad',msg:'STOP OUT: margin level fell below '+STOP_OUT+'%. Positions closed.'});
      this.closeAll(null,'so');changed=true;
    }
    if(changed){this.save();this.emit('change');}
  }

  /* ---------- stats ---------- */
  stats(){
    const h=this.history,w=h.filter(x=>x.profit>0),l=h.filter(x=>x.profit<=0);
    const gp=w.reduce((a,x)=>a+x.profit,0),gl=-l.reduce((a,x)=>a+x.profit,0);
    return {trades:h.length,wins:w.length,winRate:h.length?w.length/h.length*100:0,net:gp-gl,
      pf:gl>0?gp/gl:(gp>0?Infinity:0),avgWin:w.length?gp/w.length:0,avgLoss:l.length?-gl/l.length:0};
  }

  /* ---------- persistence ---------- */
  save(){
    if(window.NO_SAVE)return;
    try{
      localStorage.setItem(STORE_KEY,JSON.stringify({
        v:ENGINE_VER,seed:this.m.seed,t0:this.m.t0,minutes:this.m.minutes,sub:this.m.sub,
        main:this.main,balance:this.balance,positions:this.positions,pending:this.pending,
        history:this.history,transfers:this.transfers.slice(0,100),nextId:this.nextId,
        ui:window.UI_STATE||{}
      }));
    }catch(e){}
  }
  restore(s){
    this.main=s.main;this.balance=s.balance;this.positions=s.positions||[];this.pending=s.pending||[];
    this.history=s.history||[];this.transfers=s.transfers||[];this.nextId=s.nextId||1001;
  }
}

'use strict';
/* ===================== CHART: layout + rendering ===================== */
const THEMES={
  dark:{bg:'#0e1218',grid:'#18202a',text:'#8b97a8',axisBg:'#121821',border:'#243040',up:'#26a69a',down:'#ef5350',
    cross:'#7d8a9e',tag:'#2a3647',tagText:'#e6edf6',rsi:'#b388ff',rsiBand:'rgba(179,136,255,.08)',draw:'#f5c542',
    fvgUp:'rgba(38,166,154,.18)',fvgDn:'rgba(239,83,80,.18)',volUp:'rgba(38,166,154,.55)',volDn:'rgba(239,83,80,.55)',ask:'#5c6b80'},
  light:{bg:'#ffffff',grid:'#eef1f5',text:'#556070',axisBg:'#f6f8fa',border:'#d5dbe3',up:'#14917f',down:'#d9363e',
    cross:'#7d8a9e',tag:'#e3e8ef',tagText:'#1b2430',rsi:'#7e57c2',rsiBand:'rgba(126,87,194,.08)',draw:'#c78a00',
    fvgUp:'rgba(20,145,127,.16)',fvgDn:'rgba(217,54,62,.16)',volUp:'rgba(20,145,127,.5)',volDn:'rgba(217,54,62,.5)',ask:'#9aa6b6'}
};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NICE_MS=[60e3,300e3,900e3,1800e3,3600e3,7200e3,14400e3,21600e3,43200e3,86400e3,172800e3,604800e3,1209600e3,2592000e3];
const RSI_P=14;

function fmtTime(t,full){
  const d=new Date(t),p=n=>String(n).padStart(2,'0');
  const s=p(d.getUTCHours())+':'+p(d.getUTCMinutes());
  return full?d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear()+'  '+s:s;
}
function niceStep(range,target){
  const raw=range/target,pow=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/pow;
  return (f<1.5?1:f<3.5?2:f<7.5?5:10)*pow;
}
function rsiStep(c,i,s){
  const d=c[i].c-c[i-1].c,g=d>0?d:0,l=d<0?-d:0;
  if(i<RSI_P)return [{ag:0,al:0,sg:s.sg+g,sl:s.sl+l},NaN];
  let ag,al;
  if(i===RSI_P){ag=(s.sg+g)/RSI_P;al=(s.sl+l)/RSI_P;}
  else{ag=(s.ag*(RSI_P-1)+g)/RSI_P;al=(s.al*(RSI_P-1)+l)/RSI_P;}
  return [{ag,al,sg:0,sl:0},al===0?100:100-100/(1+ag/al)];
}

class Chart{
  constructor(canvas,opts){
    this.cv=canvas;this.ctx=canvas.getContext('2d');this.opts=opts;
    this.theme=THEMES.dark;this.sym=null;this.tf='M5';
    this.barW=9;this.shift=8;this.autoY=true;this.yMin=0;this.yMax=1;
    this.show={vol:true,rsi:true,fvg:false,grid:true,magnet:false};
    this.drawings={};this.tool=null;this.pendingDraw=null;this.selected=null;
    this.mouse=null;this.dragLine=null;this.lastN=0;this.rsiCache={};this.axisW=72;this.axisH=24;
    this.W=0;this.H=0;this.dpr=1;this.dirty=true;this.c=[];this.n=0;this.vis=[0,0];
    this.initInput();this.resize();
  }
  requestDraw(){this.dirty=true;}
  resize(){
    const r=this.cv.getBoundingClientRect();if(!r.width||!r.height)return;
    this.dpr=window.devicePixelRatio||1;this.W=Math.floor(r.width);this.H=Math.floor(r.height);
    this.cv.width=Math.floor(this.W*this.dpr);this.cv.height=Math.floor(this.H*this.dpr);
    this.layout();this.dirty=true;
  }
  layout(){
    const avail=this.H-this.axisH;this.plotW=this.W-this.axisW;
    const vh=this.show.vol?Math.max(48,Math.round(avail*0.12)):0,rh=this.show.rsi?Math.max(70,Math.round(avail*0.18)):0;
    const mh=avail-vh-rh;
    this.main={y0:0,y1:mh};
    this.volP=vh?{y0:mh,y1:mh+vh}:null;
    this.rsiP=rh?{y0:mh+vh,y1:mh+vh+rh}:null;
    this.timeY=avail;
  }
  setSymbol(sym,tf){
    if(sym===this.sym&&tf!==this.tf&&this.n&&this.shift<-1)this.anchorT=this.c[0].t+Math.round(this.idxOfXf(this.plotW))*this.tfMs();
    if(sym!==this.sym||tf!==this.tf){this.sym=sym;this.tf=tf;this.lastN=0;this.autoY=true;this.shift=this.anchorT?this.shift:8;}
    this.requestDraw();
  }
  tfMs(){return TFMS[this.tf];}

  /* ---------- coordinate transforms ---------- */
  xOfIdx(i){return this.plotW-(this.shift+(this.n-1-i)+0.5)*this.barW;}
  idxOfXf(x){return this.n-1-((this.plotW-x)/this.barW-this.shift-0.5);}
  xOfTime(t){return this.xOfIdx((t-this.c[0].t)/this.tfMs());}
  timeOfX(x){return this.c[0].t+Math.round(this.idxOfXf(x))*this.tfMs();}
  yOfP(p){return this.main.y0+(this.yMax-p)/(this.yMax-this.yMin)*(this.main.y1-this.main.y0);}
  pOfY(y){return this.yMax-(y-this.main.y0)/(this.main.y1-this.main.y0)*(this.yMax-this.yMin);}

  /* ---------- indicators ---------- */
  rsi(){
    const c=this.c,n=this.n,key=this.sym+'|'+this.tf;
    let k=this.rsiCache[key];
    if(!k||k.firstT!==c[0].t||k.len>n){k={vals:[NaN],len:1,st:{ag:0,al:0,sg:0,sl:0},firstT:c[0].t};this.rsiCache[key]=k;}
    for(let i=k.len;i<n-1;i++){const r=rsiStep(c,i,k.st);k.st=r[0];k.vals[i]=r[1];}
    if(n-1>=k.len)k.len=n-1;
    if(n>1&&n-1>=1){k.vals[n-1]=rsiStep(c,n-1,k.st)[1];}
    k.vals.length=n;
    return k.vals;
  }

  /* ---------- main draw ---------- */
  draw(){
    if(!this.sym)return;
    const c=this.opts.getCandles(this.sym,this.tf);if(!c||!c.length)return;
    this.c=c;const n=c.length;
    if(this.anchorT){this.shift=(this.anchorT-c[0].t)/this.tfMs()-(n-1)-0.5;this.anchorT=null;this.lastN=n;}
    if(this.lastN&&n>this.lastN&&this.shift<-1)this.shift-=(n-this.lastN);   // keep a scrolled-back view fixed while new candles form
    this.lastN=n;this.n=n;
    this.layout();
    this.barW=Math.max(1.5,Math.min(60,this.barW));
    this.shift=Math.max(-(n-3),Math.min(this.plotW/this.barW*0.6,this.shift));
    const i0=Math.max(0,Math.floor(this.idxOfXf(0))-1),i1=Math.min(n-1,Math.ceil(this.idxOfXf(this.plotW))+1);
    this.vis=[i0,i1];
    if(this.autoY||!(this.yMax>this.yMin)){
      let lo=Infinity,hi=-Infinity;
      for(let i=i0;i<=i1;i++){if(c[i].l<lo)lo=c[i].l;if(c[i].h>hi)hi=c[i].h;}
      if(!isFinite(lo)){lo=c[n-1].l;hi=c[n-1].h;}
      const R=(hi-lo)||hi*0.0005;
      if(this.opts.getLines)for(const l of this.opts.getLines(this.sym)){if(l.price>lo-3*R&&l.price<hi+3*R){if(l.price<lo)lo=l.price;if(l.price>hi)hi=l.price;}}
      const pad=(hi-lo)*0.1||hi*0.0005;this.yMin=lo-pad;this.yMax=hi+pad;
    }
    const ctx=this.ctx,T=this.theme,dpr=this.dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=T.bg;ctx.fillRect(0,0,this.W,this.H);
    ctx.font='11px system-ui,Segoe UI,Arial,sans-serif';ctx.textBaseline='middle';
    this.drawGrid();
    ctx.save();ctx.beginPath();ctx.rect(0,0,this.plotW,this.timeY);ctx.clip();
    if(this.show.fvg)this.drawFVG(i0,i1);
    this.drawCandles(i0,i1);
    this.drawDrawings();
    if(this.opts.getMarkers)this.drawMarkers();
    this.drawTradeLines();
    ctx.restore();
    if(this.volP)this.drawVolume(i0,i1);
    if(this.rsiP)this.drawRSI(i0,i1);
    this.drawPriceLine();
    this.drawAxes();
    this.drawCrosshair();
    this.drawLegend();
    this.dirty=false;
  }

  drawGrid(){
    const ctx=this.ctx,T=this.theme,m=this.main;
    ctx.strokeStyle=T.border;ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(this.plotW+0.5,0);ctx.lineTo(this.plotW+0.5,this.timeY);
    ctx.moveTo(0,this.timeY+0.5);ctx.lineTo(this.W,this.timeY+0.5);
    for(const p of [this.volP,this.rsiP]){if(p){ctx.moveTo(0,p.y0+0.5);ctx.lineTo(this.W,p.y0+0.5);}}
    ctx.stroke();
    if(!this.show.grid)return;
    ctx.strokeStyle=T.grid;ctx.beginPath();
    const step=niceStep(this.yMax-this.yMin,(m.y1-m.y0)/55);
    for(let p=Math.ceil(this.yMin/step)*step;p<this.yMax;p+=step){const y=Math.round(this.yOfP(p))+0.5;ctx.moveTo(0,y);ctx.lineTo(this.plotW,y);}
    for(const t of this.timeTicks()){const x=Math.round(t.x)+0.5;ctx.moveTo(x,0);ctx.lineTo(x,this.timeY);}
    ctx.stroke();
  }
  timeTicks(){
    const out=[],ms=this.tfMs(),c=this.c;
    const want=ms*Math.ceil(95/this.barW);
    let step=NICE_MS[NICE_MS.length-1];
    for(const s of NICE_MS){if(s>=want&&s>=ms){step=s;break;}}
    const tL=c[0].t+Math.floor(this.idxOfXf(0))*ms,tR=c[0].t+Math.ceil(this.idxOfXf(this.plotW))*ms;
    for(let t=Math.ceil(tL/step)*step;t<=tR;t+=step){
      const x=this.xOfTime(t);if(x<0||x>this.plotW)continue;
      out.push({x,t,day:step>=86400000||t%86400000===0});
    }
    return out;
  }
  drawCandles(i0,i1){
    const ctx=this.ctx,T=this.theme,c=this.c,bw=this.barW;
    if(bw<3){ // zoomed far out: draw as thin OHLC lines
      for(const up of [true,false]){
        ctx.strokeStyle=up?T.up:T.down;ctx.beginPath();
        for(let i=i0;i<=i1;i++){const k=c[i];if((k.c>=k.o)!==up)continue;const x=Math.round(this.xOfIdx(i))+0.5;ctx.moveTo(x,this.yOfP(k.h));ctx.lineTo(x,this.yOfP(k.l));}
        ctx.stroke();
      }
      return;
    }
    const body=Math.max(1,Math.floor(bw*0.72));
    for(const up of [true,false]){
      const col=up?T.up:T.down;ctx.fillStyle=col;ctx.strokeStyle=col;
      ctx.beginPath();
      for(let i=i0;i<=i1;i++){
        const k=c[i];if((k.c>=k.o)!==up)continue;
        const x=Math.round(this.xOfIdx(i))+0.5;ctx.moveTo(x,this.yOfP(k.h));ctx.lineTo(x,this.yOfP(k.l));
      }
      ctx.stroke();
      for(let i=i0;i<=i1;i++){
        const k=c[i];if((k.c>=k.o)!==up)continue;
        const x=Math.round(this.xOfIdx(i)-body/2),yo=this.yOfP(k.o),yc=this.yOfP(k.c);
        ctx.fillRect(x,Math.min(yo,yc),body,Math.max(1,Math.abs(yc-yo)));
      }
    }
  }
  drawFVG(i0,i1){
    if(i1-i0>1600)return;
    const ctx=this.ctx,T=this.theme,c=this.c;
    let avg=0;for(let i=i0;i<=i1;i++)avg+=c[i].h-c[i].l;avg/=Math.max(1,i1-i0+1);
    for(let i=Math.max(2,i0);i<=i1;i++){
      let top,bot,bull;
      if(c[i-2].h<c[i].l){bot=c[i-2].h;top=c[i].l;bull=true;}
      else if(c[i-2].l>c[i].h){top=c[i-2].l;bot=c[i].h;bull=false;}
      else continue;
      if(top-bot<avg*0.25)continue;
      let end=this.n-1;
      for(let j=i+1;j<=i1;j++){if(bull?c[j].l<=bot:c[j].h>=top){end=j;break;}}
      const x0=this.xOfIdx(i-1)-this.barW/2,x1=end===this.n-1?this.plotW:this.xOfIdx(end)+this.barW/2;
      ctx.fillStyle=bull?T.fvgUp:T.fvgDn;
      ctx.fillRect(x0,this.yOfP(top),x1-x0,this.yOfP(bot)-this.yOfP(top));
    }
  }
  drawVolume(i0,i1){
    const ctx=this.ctx,T=this.theme,c=this.c,p=this.volP;let mx=1;
    for(let i=i0;i<=i1;i++)if(c[i].v>mx)mx=c[i].v;
    ctx.save();ctx.beginPath();ctx.rect(0,p.y0+1,this.plotW,p.y1-p.y0-1);ctx.clip();
    const h=p.y1-p.y0-16,body=Math.max(1,Math.floor(this.barW*0.72));
    for(const up of [true,false]){
      ctx.fillStyle=up?T.volUp:T.volDn;
      for(let i=i0;i<=i1;i++){
        const k=c[i];if((k.c>=k.o)!==up)continue;
        const bh=Math.max(1,k.v/mx*h);ctx.fillRect(Math.round(this.xOfIdx(i)-body/2),p.y1-bh-2,body,bh);
      }
    }
    ctx.restore();
    ctx.fillStyle=T.text;ctx.textAlign='left';
    const k=c[this.hoverIdx()??this.n-1];
    ctx.fillText('Volume  '+(k?k.v.toLocaleString():''),8,p.y0+10);
    ctx.textAlign='right';ctx.fillText(mx>=1000?(mx/1000).toFixed(1)+'K':String(mx),this.W-6,p.y0+10);
  }
  drawRSI(i0,i1){
    const ctx=this.ctx,T=this.theme,p=this.rsiP,vals=this.rsi(),h=p.y1-p.y0-18,top=p.y0+10;

  zoom(factor){this.zoomTo(this.barW*factor,this.plotW*0.6);},
  scrollBars(k){this.shift-=k;this.requestDraw();},            // k>0 moves back in time (older candles)
  goLive(){this.shift=8;this.autoY=true;this.requestDraw();},
  goStart(){this.shift=-(this.n-Math.floor(this.plotW/this.barW)+3);this.requestDraw();},
  isLive(){return this.shift>=-1;},
  setTool(t){this.tool=t;this.pendingDraw=null;this.cv.style.cursor=t?'crosshair':'';this.requestDraw();if(this.opts.onToolChange)this.opts.onToolChange(t);},
  toggle(k){this.show[k]=!this.show[k];this.layout();this.requestDraw();},
  setTheme(name){this.theme=THEMES[name];this.requestDraw();},
  exportDrawings(){return this.drawings;},
  importDrawings(d){this.drawings=d||{};this.requestDraw();},
  clearDrawings(){this.drawings[this.sym]=[];this.selected=null;this.changed();},
  changed(){this.requestDraw();if(this.opts.onDrawingsChanged)this.opts.onDrawingsChanged();},

    cv.addEventListener('pointercancel',e=>this.onUp(e));

      e.preventDefault();const p=this.pos(e);
      if(this.opts.onContext&&p.x<this.plotW&&p.y<this.main.y1)this.opts.onContext({price:this.pOfY(p.y),cx:e.clientX,cy:e.clientY});
    });

  },
  pos(e){const r=this.cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};},
  onKey(e){

    else if(e.key==='ArrowRight'){this.scrollBars(e.shiftKey?-60:-10);e.preventDefault();}
    else if(e.key==='+'||e.key==='='){this.zoom(1.2);}
    else if(e.key==='-'||e.key==='_'){this.zoom(1/1.2);}
    else if(e.key==='End'){this.goLive();}
    else if(e.key==='Home'){this.goStart();}
    else if(e.key==='Escape'){this.pendingDraw=null;this.selected=null;if(this.tool)this.setTool(null);this.requestDraw();}

  },
  onWheel(e){

  },
  onDown(e){

  onMove(e){

/* New sessions open on a weekday shortly before the London open, never in a dead weekend market. */
function startTime(){
  const now=Date.now();let d=now-(now%86400000);
  for(let i=0;i<8;i++,d-=86400000){const dow=new Date(d).getUTCDay();if(dow>=1&&dow<=5&&d+6.5*3600000<=now)return d+6.5*3600000;}
  return now-(now%60000);
}
/* ---------- boot ---------- */
function boot(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE_KEY));}catch(e){}
  setTimeout(()=>{try{init(saved);}catch(err){console.error(err);$('loading').innerHTML='<div><p>Could not start the simulator.</p><pre style="max-width:80vw;white-space:pre-wrap">'+esc(err&&err.stack||err)+'</pre><button class="tb" onclick="localStorage.removeItem(STORE_KEY);location.reload()">Reset saved data and retry</button></div>';}},40);
}
function init(saved){
  const stale=!!saved&&saved.v!==ENGINE_VER;          // saved by an older version whose market can't be replayed
  const keep=!!saved&&!stale;
  const seed=keep?saved.seed:(Math.random()*2147483647)|0;
  const t0=keep?saved.t0:startTime()-HIST_MIN*60000;
  const mins=keep?Math.max(saved.minutes,HIST_MIN):HIST_MIN;
  const market=G.market=new Market(seed,t0,mins);
  if(keep&&saved.sub>0)for(let i=0;i<saved.sub&&i<SUB;i++)market.tick();   // resume mid-minute so prices match exactly
  const broker=G.broker=new Broker(market);
  let dropped=0;
  if(saved){
    broker.restore(saved);if(saved.ui)Object.assign(G.ui,saved.ui);
    if(stale){dropped=broker.positions.length+broker.pending.length;broker.positions=[];broker.pending=[];G.ui.drawings={};}
  }
  window.UI_STATE=G.ui;
  if(!INST_BY_SYM[G.ui.sym])G.ui.sym='EURUSD';
  if(!TFMS[G.ui.tf])G.ui.tf='M5';
  if(!(G.ui.speed>=0&&G.ui.speed<SPEEDS.length))G.ui.speed=2;
  G.chart=new Chart($('cv'),{
    getCandles:(s,tf)=>market.candles(s,tf),getQuote:s=>market.quote(s),getLines,onLineDrag,onContext,getMarkers,
    onToolChange:t=>document.querySelectorAll('#drawBar [data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===(t||''))),
    onDrawingsChanged:()=>{G.ui.drawings=G.chart.exportDrawings();broker.save();}
  });
  Object.assign(G.chart.show,G.ui.show||{});G.ui.show=G.chart.show;
  G.chart.importDrawings(G.ui.drawings);G.ui.drawings=G.chart.drawings;
  setTheme(G.ui.theme,true);
  buildHeader();bindUI();bindMarket();
  G.chart.setSymbol(G.ui.sym,G.ui.tf);G.chart.resize();
  market.live=true;
  $('loading').style.display='none';
  refreshAll();
  if(!saved)welcomeModal();
  else if(stale)openModal('<h3>TradingStrategist was updated</h3><p>This version has a more realistic market, so the market from your old session cannot continue. Your balances, transfers and trade history were kept and a fresh market was generated.'+(dropped?' <b>'+dropped+' open trade(s) / pending order(s)</b> from the old market were removed without profit or loss.':'')+'</p><div class="btns"><button class="tb accent" id="uOk">Continue</button></div>',true),$('uOk').onclick=closeModal;
  try{localStorage.setItem('tl_probe','1');localStorage.removeItem('tl_probe');}catch(e){toast('Your browser is blocking storage (private mode?). The simulator works, but progress will not be saved.','warn',9000);}
  document.querySelectorAll('button[title]').forEach(b=>{if(!b.getAttribute('aria-label'))b.setAttribute('aria-label',b.title);});
  setInterval(()=>broker.save(),5000);
  window.addEventListener('beforeunload',()=>broker.save());
  G.last=performance.now();requestAnimationFrame(frame);
}
function bindMarket(){
  const m=G.market,b=G.broker;
  m.on('pre',onNewsPre);m.on('soon',onNewsSoon);m.on('release',onNewsRelease);
  b.on('toast',t=>toast(t.msg,t.kind==='bad'?'bad':''));
  b.on('change',()=>{G.panelsDirty=true;});
  b.on('closed',r=>{
    const why={tp:'Take profit hit',sl:'Stop loss hit',manual:'Closed',so:'STOP OUT'}[r.reason]||'Closed';
    const d=INST_BY_SYM[r.p.sym],slip=r.reason==='sl'&&r.p.sl?Math.abs(r.price-r.p.sl)/pipSize(d):0;
    toast(why+': <b>'+r.p.sym+'</b> #'+r.p.id+' <span class="'+cls(r.net)+'">'+signed(r.net)+'</span>'+(slip>=0.5?'<br><span class="mute">Slipped '+slip.toFixed(1)+(d.cls==='Forex'?' pips':' pts')+' past your stop</span>':''),r.net>=0?'good':'bad',r.reason==='manual'?5000:9000);
    if(r.reason!=='manual')beep(r.net>=0?988:330,0.2);
  });
}
function frame(ts){
  const dt=Math.min(0.25,(ts-G.last)/1000);G.last=ts;
  const rate=SPEEDS[G.ui.speed].tps;let ticked=false;
  if(rate>0&&!G.hold){
    G.acc+=dt*rate;const n=Math.min(Math.floor(G.acc),600);G.acc=Math.min(G.acc-n,1);
    for(let i=0;i<n;i++){G.market.tick();G.broker.onTick();ticked=true;}
  }
  if(ticked)G.chart.requestDraw();
  if(G.chart.dirty)G.chart.draw();
  if(ts-G.lastPanel>250||G.panelsDirty){G.lastPanel=ts;G.panelsDirty=false;refreshAll();}
  requestAnimationFrame(frame);
}

/* ---------- ticket ---------- */
function rejectOrder(err,sym,lots,price){
  let extra='';
  if(/free margin/i.test(err)){
    const b=G.broker,need=Math.max(100,Math.ceil((b.marginFor(sym,lots,price)-b.freeMargin)/100)*100);
    extra='<br><span class="mute">Your Trading account has '+money(b.balance)+' and your Main account has '+money(b.main)+'.</span><br><button class="mini" id="stFund" data-need="'+need+'">Transfer funds to Trading…</button>';
  }
  setStatus('<b>✖ Order NOT placed.</b> '+esc(err)+extra,'bad');toast('Order rejected: '+esc(err),'bad',8000);beep(330,0.2);
}
function marketOrder(type){
  const lots=Math.round(num('oLots')*100)/100,sl=num('oSL'),tp=num('oTP'),q=G.market.quote(G.ui.sym);
  const err=G.broker.marketOrder(G.ui.sym,type,lots,sl,tp);
  if(err){rejectOrder(err,G.ui.sym,lots,type==='buy'?q.ask:q.bid);return;}
  const p=G.broker.positions[G.broker.positions.length-1],dg=INST_BY_SYM[p.sym].digits;
  setStatus('<b>✔ '+type.toUpperCase()+' '+lots.toFixed(2)+' '+p.sym+'</b> opened @ '+p.open.toFixed(dg)+' (ticket #'+p.id+')<br>Stop loss: <b>'+(p.sl?p.sl.toFixed(dg):'none')+'</b> · Take profit: <b>'+(p.tp?p.tp.toFixed(dg):'none')+'</b><br><span class="mute">Both are active. See it in the Trade tab below.</span>','good');
  toast('<b>'+type.toUpperCase()+'</b> '+lots.toFixed(2)+' '+p.sym+' @ '+p.open.toFixed(dg)+(p.sl?' · SL '+p.sl.toFixed(dg):'')+(p.tp?' · TP '+p.tp.toFixed(dg):''),'good');
  $('oSL').value='';$('oTP').value='';G.ui.tab='pos';G.panelsDirty=true;
}
function placePending(){
  const t=$('oType').value,lots=Math.round(num('oLots')*100)/100,px=num('oPrice'),err=G.broker.pendingOrder(G.ui.sym,t,lots,px,num('oSL'),num('oTP'));
  if(err){rejectOrder(err,G.ui.sym,lots,px||G.market.quote(G.ui.sym).bid);return;}
  setStatus('<b>✔ '+t.replace('_',' ').toUpperCase()+' '+lots.toFixed(2)+' '+G.ui.sym+'</b> placed @ '+px+'.<br><span class="mute">It waits in the Pending tab and becomes a trade when price reaches it.</span>','good');
  toast('Pending order placed: '+t.replace('_',' ')+' '+G.ui.sym+' @ '+px,'good');
  $('oSL').value='';$('oTP').value='';$('oPrice').value='';$('oType').value='market';$('oType').onchange();G.ui.tab='pend';G.panelsDirty=true;
}
function lotsFromRisk(){
  const sl=num('oSL'),d=def(),q=G.market.quote(G.ui.sym),t=$('oType').value;
  if(!sl){toast('Set a stop loss first, then calculate lots from your risk %.','warn');return;}
  const entry=t==='market'?(sl<q.bid?q.ask:q.bid):num('oPrice')||q.bid;
  const per=Math.abs(G.broker.toUSD(G.ui.sym,(entry-sl)*d.contract));
  if(!per){toast('Stop loss is too close to the entry price.','warn');return;}
  const risk=G.broker.equity*num('oRisk')/100,lots=Math.max(0.01,Math.floor(risk/per*100)/100);
  $('oLots').value=lots.toFixed(2);G.panelsDirty=true;
  toast('Risking '+money(risk)+' ('+num('oRisk')+'% of equity) → '+lots.toFixed(2)+' lots','');
}
function doTransfer(dir){
  const a=num('xAmt'),e=G.broker.transfer(dir,a);
  if(e){toast(e,'bad');return;}
  toast((dir==='toTrading'?'Main → Trading: ':'Trading → Main: ')+money(a),'good');$('xAmt').value='';G.panelsDirty=true;
}
function updateTicket(){
  const q=G.market.quote(G.ui.sym),d=def(),dg=d.digits,pip=pipSize(d),b=G.broker;
  $('tkSym').textContent=G.ui.sym;$('pxSell').textContent=q.bid.toFixed(dg);$('pxBuy').textContent=q.ask.toFixed(dg);
  $('spr').textContent=(q.spread/pip).toFixed(1)+(d.cls==='Forex'?' pip':'');
  document.title=G.ui.sym+' '+q.bid.toFixed(dg)+' — TradingStrategist';
  const lots=num('oLots'),sl=num('oSL'),tp=num('oTP'),t=$('oType').value,unit=d.cls==='Forex'?' pips':' pts';
  const buy=t==='market'?(sl?sl<q.bid:tp?tp>q.ask:true):t.startsWith('buy');
  const entry=t==='market'?(buy?q.ask:q.bid):(num('oPrice')||q.bid);
  $('hintSL').textContent=sl?'Distance '+(Math.abs(entry-sl)/pip).toFixed(1)+unit:'';
  $('hintTP').textContent=tp?'Distance '+(Math.abs(tp-entry)/pip).toFixed(1)+unit:'';
  const margin=b.marginFor(G.ui.sym,lots,entry);
  const rl=sl?Math.abs(b.toUSD(G.ui.sym,(entry-sl)*lots*d.contract)):0,rw=tp?Math.abs(b.toUSD(G.ui.sym,(tp-entry)*lots*d.contract)):0;
  const short=margin>b.freeMargin;
  $('tkSummary').innerHTML=(short?'<div style="color:var(--down)"><b>Not enough free margin. Transfer funds to the Trading account first.</b></div>':'')+'<div><span>Margin required</span><b>'+money(margin)+'</b></div>'+

function onLineDrag(line,price){
  const b=G.broker,dg=INST_BY_SYM[G.ui.sym].digits;price=+price.toFixed(dg);
  const p=b.positions.find(x=>x.id===line.id),o=b.pending.find(x=>x.id===line.id);let err=null;
  if(line.kind==='sl')err=b.modify(line.id,price,p.tp);

  else if(line.kind==='psl')err=b.modify(line.id,price,o.tp);
  else if(line.kind==='ptp')err=b.modify(line.id,o.sl,price);
  else if(line.kind==='pend'){
    const q=G.market.quote(o.sym),ok=(o.type==='buy_limit'&&price<q.ask)||(o.type==='sell_limit'&&price>q.bid)||(o.type==='buy_stop'&&price>q.ask)||(o.type==='sell_stop'&&price<q.bid);
    if(ok)b.movePending(line.id,price);else err='That price is on the wrong side of the market for a '+o.type.replace('_',' ')+'.';

/* ---------- news ---------- */
function impHTML(n){return '<span class="imp i'+n+'"><i></i><i></i><i></i></span>';}
function pairEffects(ev){
  const out=[],imp=ev.lean*ev.dir;
  if(!imp)return out;
  for(const d of INSTRUMENTS){const f=d.fx[ev.ccy];if(f===undefined)continue;const e=imp*f;out.push({sym:d.sym,up:e>0});}
  return out;
}
function predictionHTML(ev,compact,noNote){
  const where=ev.lean===0?'close to the forecast':ev.lean>0?'<b>above</b> the forecast':'<b>below</b> the forecast';
  const imp=ev.lean*ev.dir;
  const bias=ev.lean===0?'No clear edge — expect a choppy, two-way reaction.':(imp>0?'Bullish':'Bearish')+' for <b>'+ev.ccy+'</b> if it prints as expected.';
  let h='<b>Prediction:</b> '+ev.title+' likely '+where+' ('+ev.conf+'% model confidence). '+bias;
  if(!compact){const pe=pairEffects(ev);if(pe.length)h+='<div class="pairs">'+pe.map(p=>'<span class="chip '+(p.up?'up':'dn')+'">'+p.sym+(p.up?' ▲':' ▼')+'</span>').join('')+'</div>';}
  return noNote?h:h+'<div class="mute" style="margin-top:3px;font-size:11px">Forecasts can be wrong — manage your risk.</div>';
}
function updateNews(){
  const m=G.market,now=m.simTime;let h='<div class="nsub">Upcoming</div>';
  for(const ev of m.upcoming(5)){
    h+='<div class="nrow"><div class="t"><span>'+impHTML(ev.impact)+esc(ev.title)+'</span><span class="'+(ev.state>=1?'dn':'mute')+'">'+(ev.state>=1?'⏱ ':'')+countdown(ev.t-now)+'</span></div>'+
      '<div class="m">'+ev.ccy+' · '+fmtTime(ev.t)+' UTC · Forecast '+nv(ev,ev.forecast)+' · Prev '+nv(ev,ev.previous)+'</div>'+
      (ev.state>=1?'<div class="pred">'+predictionHTML(ev,true)+'</div>':'<div class="pred lock">Prediction is published 10 minutes before release.</div>')+'</div>';
  }
  const rel=m.released(8);
  if(rel.length){
    h+='<div class="nsub">Released</div>';
    for(const ev of rel){
      const imp=ev.steps*ev.dir,v=ev.steps===0?'In line':ev.steps>0?'Higher':'Lower';
      h+='<div class="nrow"><div class="t"><span>'+impHTML(ev.impact)+esc(ev.title)+'</span><span class="'+(imp>0?'up':imp<0?'dn':'mute')+'">'+(imp>0?'Bullish '+ev.ccy:imp<0?'Bearish '+ev.ccy:'Neutral')+'</span></div>'+
        '<div class="m">'+fmtTime(ev.t)+' UTC · Actual <b>'+nv(ev,ev.actual)+'</b> vs Forecast '+nv(ev,ev.forecast)+' ('+v+')</div></div>';
    }
  }
  safeSet($('newsList'),h);
}
function relevant(ev){
  const d=def();if(G.market.affects(d,ev))return true;
  return G.broker.positions.some(p=>G.market.affects(INST_BY_SYM[p.sym],ev));
}

function onNewsRelease(ev){
  G.results.push({ev,until:performance.now()+30000});
  if(relevant(ev)){toast('<b>'+esc(ev.title)+'</b>: actual '+nv(ev,ev.actual)+' vs forecast '+nv(ev,ev.forecast),'warn',8000);beep(1100,0.3);}
  G.panelsDirty=true;
}

/* ---------- modals ---------- */
function openModal(html,dismiss){$('mbox').innerHTML=html;$('modal').hidden=false;G.modalDismissable=!!dismiss;}
function closeModal(){$('modal').hidden=true;}
function welcomeModal(){
  G.hold=true;
  openModal('<h3>Welcome to TradingStrategist</h3><p>Practise price action, ICT and smart-money concepts on a simulated market that needs no internet or data. Set up your two accounts to begin.</p>'+
    '<label class="row"><span>Main account ($)</span><input id="wMain" type="number" min="0" value="10000"></label>'+
    '<label class="row"><span>Fund trading account ($)</span><input id="wFund" type="number" min="0" value="5000"></label>'+
    '<p style="margin-top:10px;font-size:12px">You can move money between the accounts and add more to Main at any time. Scroll wheel zooms the chart, drag pans back through history, right-click places orders.</p>'+
    '<p style="font-size:11px">Educational simulator with artificial prices and play money. Not financial advice and not a prediction of real markets.</p><div class="btns"><button class="tb accent" id="wGo">Start trading</button></div>',false);
  $('wGo').onclick=()=>{
    const main=parseFloat($('wMain').value),fund=parseFloat($('wFund').value)||0;
    if(!(main>=0)||fund<0||fund>main){toast('Funding amount cannot be more than the Main account.','bad');return;}
    const b=G.broker;b.main=main;b.transfers.unshift({t:G.market.simTime,type:'Starting balance (Main)',amount:main});
    if(fund>0)b.transfer('toTrading',fund);
    b.save();closeModal();G.hold=false;G.panelsDirty=true;
  };
}
function menuModal(){
  openModal('<h3>Settings</h3>'+
    '<label class="row"><span>Alert sounds</span><input type="checkbox" id="mSound" '+(G.ui.sound?'checked':'')+' style="width:auto"></label>'+
    '<p style="margin:10px 0 4px"><b>Install as an app</b></p><p style="font-size:12px;line-height:1.6">'+(isInstalledApp()?'You are running the installed app.':'Open the hosted https link, then: <b>PC (Chrome / Edge)</b> install icon in the address bar or ⋮ menu → Install TradingStrategist · <b>Android (Chrome)</b> ⋮ → Install app · <b>iPhone / iPad (Safari)</b> Share → Add to Home Screen. Once installed it opens like any app and works offline.')+'</p>'+
    '<p style="margin:10px 0 4px"><b>Shortcuts</b></p><p style="font-size:12px;line-height:1.7">Wheel = zoom · Drag = pan back/forward · Shift+wheel or ←/→ = scroll · +/− = zoom · Home / End = oldest / latest · Drag price axis = stretch scale (double-click resets) · Right-click = order menu · Del = delete selected drawing · Esc = cancel tool · <b>Space</b> = pause / resume · <b>N</b> = next candle</p><p style="font-size:11px;margin-top:8px">Educational simulator with artificial prices and play money. Not financial advice.</p>'+
    '<div class="btns"><button class="tb" id="mCsv">Export history CSV</button><button class="tb" id="mReset" style="color:var(--down)">New session (reset everything)</button><button class="tb accent" id="mClose">Done</button></div>',true);
  $('mSound').onchange=e=>{G.ui.sound=e.target.checked;G.broker.save();};
  $('mCsv').onclick=exportCSV;$('mClose').onclick=closeModal;
  $('mReset').onclick=()=>{if(confirm('This deletes your accounts, trade history and drawings and generates a brand-new market. Continue?')){window.NO_SAVE=true;try{localStorage.removeItem(STORE_KEY);}catch(e){}location.reload();}};
}
function modifyModal(id){
  const b=G.broker,p=b.positions.find(x=>x.id===id),o=b.pending.find(x=>x.id===id),it=p||o;if(!it)return;
  const dg=INST_BY_SYM[it.sym].digits,step=Math.pow(10,-dg+1);
  G.hold=true;
  openModal('<h3>Modify #'+id+' · '+it.sym+'</h3><p>'+typeTag(it.type)+' '+it.lots.toFixed(2)+' lots @ '+(p?p.open:o.price).toFixed(dg)+'</p>'+
    (o?'<label class="row"><span>Entry price</span><input id="mPx" type="number" step="'+step+'" value="'+o.price.toFixed(dg)+'"></label>':'')+
    '<label class="row"><span>Stop loss</span><input id="mSL" type="number" step="'+step+'" value="'+(it.sl?it.sl.toFixed(dg):'')+'" placeholder="none"></label>'+
    '<label class="row"><span>Take profit</span><input id="mTP" type="number" step="'+step+'" value="'+(it.tp?it.tp.toFixed(dg):'')+'" placeholder="none"></label>'+
    (p?'<label class="row"><span>Close volume (lots)</span><input id="mVol" type="number" step="0.01" min="0.01" max="'+p.lots+'" value="'+p.lots.toFixed(2)+'"></label>':'')+
    '<div class="btns"><button class="tb" id="mCancel">Cancel</button>'+(p?'<button class="tb" id="mBE" title="Set the stop loss at your entry price">SL → break-even</button><button class="tb" id="mPart" style="color:var(--down)">Close volume</button>':'')+'<button class="tb accent" id="mApply">Apply</button></div>',false);
  const done=()=>{closeModal();G.hold=false;G.panelsDirty=true;};
  $('mCancel').onclick=done;
  $('mApply').onclick=()=>{
    const sl=parseFloat($('mSL').value)||0,tp=parseFloat($('mTP').value)||0;
    if(o&&$('mPx')){
      const px=parseFloat($('mPx').value),q=G.market.quote(o.sym);
      const ok=(o.type==='buy_limit'&&px<q.ask)||(o.type==='sell_limit'&&px>q.bid)||(o.type==='buy_stop'&&px>q.ask)||(o.type==='sell_stop'&&px<q.bid);
      if(!ok){toast('Entry price is on the wrong side of the market for a '+o.type.replace('_',' '),'bad');return;}
      b.movePending(id,px);
    }
    const e=b.modify(id,sl,tp);if(e){toast(e,'bad');return;}toast('Order #'+id+' modified','good');done();
  };
  if(p)$('mBE').onclick=()=>{const e=b.modify(id,p.open,p.tp);if(e){toast(e,'bad');return;}toast('Stop loss moved to break-even ('+p.open.toFixed(dg)+')','good');done();};
  if(p)$('mPart').onclick=()=>{const v=parseFloat($('mVol').value);if(!(v>0)){toast('Enter a volume','bad');return;}b.close(id,Math.min(v,p.lots));done();};
}

window.addEventListener('DOMContentLoaded',()=>{
  $('banners').addEventListener('click',e=>{
    const b=e.target.closest('.banner');if(!b)return;
    if(b.dataset.ev)G.dismissed.add(+b.dataset.ev);
    if(b.dataset.res)G.results=G.results.filter(r=>r.ev.id!==+b.dataset.res);
    $('banners')._html=null;updateBanners();
  });
});

'use strict';
/* ===================== Installable web app (PWA) ===================== */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('bInstall');if(b)b.hidden=false;});
window.addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('bInstall');if(b)b.hidden=true;if(window.toast)toast('TradingStrategist installed. Open it from your home screen or app list.','good');});
window.addEventListener('DOMContentLoaded',()=>{
  const b=document.getElementById('bInstall');
  if(b)b.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;b.hidden=true;};
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
});
function isInstalledApp(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
